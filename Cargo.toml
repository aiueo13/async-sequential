[package]
name = "async-sequential"
version = "0.2.2"
edition = "2024"
authors = ["OkaYu"]
license = "MIT OR Apache-2.0"
description = "Running tasks sequentially on shared mutable state."
keywords = ["async", "executor", "sequential", "state", "tokio"]
repository = "https://github.com/aiueo13/async-sequential"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tokio-test = "0.4"